[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/samudera-supervisor.pid
[program:web]
command=apache2-foreground
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
[program:queue]
command=php artisan queue:work --sleep=3 --tries=1 --timeout=60 --memory=96
user=www-data
autorestart=true
stopasgroup=true
killasgroup=true
[program:scheduler]
command=php artisan schedule:work
user=www-data
autorestart=true
stopasgroup=true
killasgroup=true